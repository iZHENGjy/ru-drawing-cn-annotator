[project]
name = "ru-drawing-cn-annotator"
version = "0.1.0"
description = "Overlay Chinese translations on Russian engineering drawings (PDF and DWG/DXF) without touching the original"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "iZHENGjy" }]
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "jieba>=0.42", "ezdxf>=1.3", "pdfplumber>=0.11", "matplotlib>=3.8", "numpy>=1.26", "reportlab>=4.0", "pypdf>=4.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
scan = ["rapidocr>=3", "onnxruntime>=1.17"]
# optional: only for [llm] backend = "anthropic" (the default backend claude-cli needs the `claude` CLI instead)
llm = ["anthropic>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
