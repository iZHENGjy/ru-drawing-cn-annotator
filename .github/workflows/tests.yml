name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src tests scripts
      - run: mypy
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - run: pip install -e ".[dev]"
      - name: unit
        run: pytest -q -m "not e2e and not regression"
      - name: end-to-end (synthetic data)
        run: pytest -q -m e2e
      - name: layout regression (public baselines; private ones need DRAWTRANS_VALIDATION)
        run: pytest -q -m regression
